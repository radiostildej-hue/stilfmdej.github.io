<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stil FM Dej - Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #164b68, #06141d 50%, #02070a);
            font-family: Arial, sans-serif;
            color: white;
        }

        .player {
            width: 92%;
            max-width: 430px;
            padding: 35px 28px;
            border-radius: 28px;
            background: rgba(10, 25, 34, 0.95);
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff3b30, #b50000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 7px;
            color: #9bb4c2;
            font-size: 14px;
        }

        .now-playing {
            margin: 30px 0;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255,255,255,.06);
        }

        .label {
            color: #7eaabd;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 9px;
        }

        #song {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.4;
        }

        .play {
            width: 75px;
            height: 75px;
            border: none;
            border-radius: 50%;
            background: #ff3028;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .volume {
            margin-top: 25px;
        }

        input[type="range"] {
            width: 80%;
            accent-color: #ff3028;
        }

        .status {
            margin-top: 18px;
            font-size: 12px;
        }

        .live {
            color: #ff4038;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="player">

    <div class="logo">SFD</div>

    <h1>STIL FM DEJ</h1>
    <div class="subtitle">Un Radio In Stilul Tau! • Live</div>

    <div class="now-playing">
        <div class="label">Acum la radio</div>
        <div id="song">Se conectează...</div>
    </div>

    <button class="play" id="playButton">▶</button>

    <div class="volume">
        🔊
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div class="status">
        <span class="live">● LIVE</span>
    </div>

</div>

<audio id="radio" preload="none"></audio>

<script>

const STREAM_URL = const STREAM_URL = "https://buy-valves-sheet-possible.trycloudflare.com/StilFmDej";
// Metadata is fetched through the website domain (same origin), so the browser does not need access to the private 10.0.30.198 address.
const METADATA_URL = "";

const radio = document.getElementById("radio");
const playButton = document.getElementById("playButton");
const volume = document.getElementById("volume");
const song = document.getElementById("song");

radio.src = STREAM_URL;
radio.volume = 0.8;

playButton.addEventListener("click", function () {

    if (radio.paused) {

        radio.play()
            .then(function () {
                playButton.textContent = "❚❚";
            })
            .catch(function (error) {
                console.error("Eroare player:", error);
            });

    } else {

        radio.pause();
        playButton.textContent = "▶";
    }
});

radio.addEventListener("play", function () {
    playButton.textContent = "❚❚";
});

radio.addEventListener("pause", function () {
    playButton.textContent = "▶";
});

volume.addEventListener("input", function () {
    radio.volume = this.value;
});


function updateSong() {
    // GitHub Pages is static and cannot run PHP.
    // The song title will be enabled after we expose Icecast metadata over HTTPS.
    song.textContent = "Stil FM Dej - Live";
}

updateSong();

</script>

</body>
</html>
